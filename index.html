<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Koleksi Promosi Khas</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .fade-enter { opacity: 0; transition: opacity 0.8s ease-in-out; }
        .fade-enter-active { opacity: 1; }
        .progress-bar-fill { transition: width 0.1s linear; }
        .thumb-preview { transition: transform 0.2s ease, opacity 0.3s ease, box-shadow 0.2s ease; }
        .thumb-preview:hover { transform: scale(1.06); box-shadow: 0 0 0 2px rgba(99, 102, 241, 0.6); z-index: 10; }
        .thumbs-scroll::-webkit-scrollbar { height: 5px; }
        .thumbs-scroll::-webkit-scrollbar-track { background: transparent; }
        .thumbs-scroll::-webkit-scrollbar-thumb { background: rgba(99, 102, 241, 0.45); border-radius: 4px; }
        .side-thumbs { scrollbar-width: none; }
        .side-thumbs::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="bg-slate-900 text-white min-h-screen flex flex-col justify-between font-sans select-none">

    <main class="flex-1 flex flex-col items-center justify-center p-2 sm:p-4 md:p-6 lg:p-8 relative w-full">
        <div class="w-full max-w-md sm:max-w-lg md:max-w-2xl lg:max-w-4xl xl:max-w-5xl bg-slate-800/80 rounded-2xl shadow-2xl border border-slate-700/50 overflow-hidden backdrop-blur-md">
            
            <div class="p-3 sm:p-4 md:p-5 text-center border-b border-slate-700/50">
                <h1 class="text-base sm:text-lg md:text-xl font-bold tracking-wide text-slate-100" id="gallery-title">Tawaran Khas Hari Ini</h1>
                <p class="text-[11px] sm:text-xs text-slate-400 mt-1">Sila tunggu sebentar, gambar sedang dimuatkan...</p>
            </div>

            <div class="flex items-stretch gap-1.5 sm:gap-2 md:gap-3 p-2 sm:p-3 md:p-4 bg-slate-900/40">
                <div id="left-thumbs" class="side-thumbs flex flex-col gap-1.5 sm:gap-2 w-12 sm:w-14 md:w-20 lg:w-24 overflow-y-auto max-h-[180px] sm:max-h-[240px] md:max-h-[320px] lg:max-h-[400px] shrink-0"></div>

                <div class="relative flex-1 aspect-[4/3] bg-black overflow-hidden flex items-center justify-center rounded-lg md:rounded-xl">
                    <img id="slideshow-image" src="" alt="Promosi" class="w-full h-full object-cover fade-enter fade-enter-active">
                    <div class="absolute top-2 right-2 sm:top-3 sm:right-3 bg-black/60 text-white text-[10px] sm:text-xs px-2 py-0.5 sm:px-2.5 sm:py-1 rounded-full backdrop-blur-md border border-white/10">
                        <span id="current-slide-num">1</span> / <span id="total-slides-num">1</span>
                    </div>
                </div>

                <div id="right-thumbs" class="side-thumbs flex flex-col gap-1.5 sm:gap-2 w-12 sm:w-14 md:w-20 lg:w-24 overflow-y-auto max-h-[180px] sm:max-h-[240px] md:max-h-[320px] lg:max-h-[400px] shrink-0"></div>
            </div>

            <div class="px-2 sm:px-3 md:px-4 pb-2 sm:pb-3">
                <div id="bottom-thumbs" class="thumbs-scroll flex gap-1.5 sm:gap-2 overflow-x-auto py-1"></div>
            </div>

            <div class="p-3 sm:p-4 md:p-5 space-y-2 sm:space-y-3 border-t border-slate-700/40">
                <div class="w-full bg-slate-700/60 h-1.5 sm:h-2 rounded-full overflow-hidden">
                    <div id="progress-bar" class="bg-indigo-500 h-full w-0 progress-bar-fill"></div>
                </div>
                <div class="flex justify-between items-center text-[11px] sm:text-xs text-slate-400">
                    <span>Masa Tinggal: <strong id="countdown-text" class="text-slate-200">0s</strong></span>
                    <span class="animate-pulse text-indigo-400">Memproses...</span>
                </div>
            </div>
        </div>
    </main>

    <footer class="py-2 sm:py-3 text-center text-[10px] sm:text-xs text-slate-500">
        &copy; <span id="year"></span> Hak Cipta Terpelihara.
    </footer>

    <div id="admin-modal" class="fixed inset-0 bg-black/80 backdrop-blur-md flex items-center justify-center p-4 z-50 hidden">
        <div class="bg-slate-800 border border-slate-700 rounded-2xl w-full max-w-lg p-6 shadow-2xl space-y-5 max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-center border-b border-slate-700 pb-3">
                <h2 class="text-lg font-bold text-indigo-400">⚙️ Borang Tetapan (Admin)</h2>
                <button id="close-admin-btn" class="text-slate-400 hover:text-white text-xl font-bold">&times;</button>
            </div>
            <form id="config-form" class="space-y-4 text-sm">
                <div>
                    <label class="block font-medium text-slate-200 mb-1">Pautan Destinasi (Shopee Link):</label>
                    <input type="url" id="input-target-url" required class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-white focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                </div>
                <div>
                    <label class="block font-medium text-slate-200 mb-1">Pautan Gambar Slideshow (1 Link Per Baris):</label>
                    <textarea id="input-images" rows="4" required class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-white font-mono text-xs focus:ring-2 focus:ring-indigo-500 focus:outline-none"></textarea>
                </div>
                <div>
                    <label class="block font-medium text-slate-200 mb-1">Pautan Gambar Preview Kiri/Kanan/Bawah (1 Link Per Baris):</label>
                    <textarea id="input-preview-images" rows="5" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-white font-mono text-xs focus:ring-2 focus:ring-indigo-500 focus:outline-none" placeholder="https://...jpg&#10;https://...jpg"></textarea>
                    <p class="text-xs text-slate-400 mt-1">Gambar kecil di tepi & bawah. Auto shuffle setiap reload.</p>
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block font-medium text-slate-200 mb-1">Masa Sedia (Saat):</label>
                        <input type="number" id="input-slide-duration" min="1" max="30" value="3" required class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-white focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                    </div>
                    <div>
                        <label class="block font-medium text-slate-200 mb-1">Tajuk Halaman:</label>
                        <input type="text" id="input-page-title" required class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-white focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                    </div>
                </div>
                <div class="flex gap-3 pt-2">
                    <button type="submit" class="flex-1 bg-indigo-600 hover:bg-indigo-500 font-bold py-2.5 rounded-lg text-white">Simpan</button>
                    <button type="button" id="reset-default-btn" class="bg-slate-700 hover:bg-slate-600 px-4 py-2.5 rounded-lg text-slate-300">Reset</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        document.getElementById('year').textContent = new Date().getFullYear();

        const DEFAULT_CONFIG = {
            targetUrl: "https://shopee.com.my",
            pageTitle: "Tawaran Khas Hari Ini",
            slideDuration: 3,
            images: [
                "https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=800",
                "https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=800",
                "https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=800"
            ],
            previewImages: []
        };

        function loadConfig() {
            const saved = localStorage.getItem('site_config');
            if (saved) {
                try {
                    const parsed = JSON.parse(saved);
                    if (!Array.isArray(parsed.previewImages)) parsed.previewImages = [];
                    return parsed;
                } catch(e) { return { ...DEFAULT_CONFIG }; }
            }
            return { ...DEFAULT_CONFIG };
        }

        let config = loadConfig();

        const imgElement = document.getElementById('slideshow-image');
        const currentSlideNum = document.getElementById('current-slide-num');
        const totalSlidesNum = document.getElementById('total-slides-num');
        const progressBar = document.getElementById('progress-bar');
        const countdownText = document.getElementById('countdown-text');
        const galleryTitle = document.getElementById('gallery-title');
        const leftThumbs = document.getElementById('left-thumbs');
        const rightThumbs = document.getElementById('right-thumbs');
        const bottomThumbs = document.getElementById('bottom-thumbs');
        const adminModal = document.getElementById('admin-modal');
        const configForm = document.getElementById('config-form');
        const inputTargetUrl = document.getElementById('input-target-url');
        const inputImages = document.getElementById('input-images');
        const inputPreviewImages = document.getElementById('input-preview-images');
        const inputSlideDuration = document.getElementById('input-slide-duration');
        const inputPageTitle = document.getElementById('input-page-title');
        const closeAdminBtn = document.getElementById('close-admin-btn');
        const resetDefaultBtn = document.getElementById('reset-default-btn');

        let currentSlideIndex = 0;
        let totalSlides = config.images.length;
        let totalDuration = totalSlides * config.slideDuration;
        let progressTimer = null;

        const SIDE_COUNT = 5;
        const BOTTOM_COUNT = 30;

        function shuffleArray(arr) {
            const a = [...arr];
            for (let i = a.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [a[i], a[j]] = [a[j], a[i]];
            }
            return a;
        }

        function createThumbElement(url, sizeClass) {
            const img = document.createElement('img');
            img.src = url;
            img.alt = 'Preview';
            img.loading = 'lazy';
            img.className = `thumb-preview ${sizeClass} object-cover rounded-md border border-slate-600/60 bg-slate-900 cursor-pointer opacity-90 hover:opacity-100`;
            img.onerror = function() { this.style.display = 'none'; };
            return img;
        }

        function renderPreviews() {
            leftThumbs.innerHTML = '';
            rightThumbs.innerHTML = '';
            bottomThumbs.innerHTML = '';

            let pool = Array.isArray(config.previewImages) ? [...config.previewImages] : [];
            if (pool.length === 0) return;

            pool = shuffleArray(pool);

            while (pool.length < SIDE_COUNT * 2 + BOTTOM_COUNT) {
                pool = pool.concat(shuffleArray(config.previewImages));
            }

            const sideClass = 'w-full aspect-square';
            for (let i = 0; i < SIDE_COUNT; i++) {
                leftThumbs.appendChild(createThumbElement(pool[i], sideClass));
            }
            for (let i = 0; i < SIDE_COUNT; i++) {
                rightThumbs.appendChild(createThumbElement(pool[SIDE_COUNT + i], sideClass));
            }

            const bottomClass = 'w-12 h-12 sm:w-14 sm:h-14 md:w-16 md:h-16 lg:w-20 lg:h-20 shrink-0';
            for (let i = 0; i < BOTTOM_COUNT; i++) {
                bottomThumbs.appendChild(createThumbElement(pool[SIDE_COUNT * 2 + i], bottomClass));
            }
        }

        function initPublicPage() {
            galleryTitle.textContent = config.pageTitle;
            totalSlides = config.images.length;
            totalSlidesNum.textContent = totalSlides;
            currentSlideIndex = 0;
            totalDuration = totalSlides * config.slideDuration;

            if (totalSlides > 0) {
                imgElement.src = config.images[0];
            }

            renderPreviews();
            startSlideshowAndRedirect();
        }

        function changeSlide(index) {
            imgElement.classList.remove('fade-enter-active');
            setTimeout(() => {
                imgElement.src = config.images[index];
                currentSlideNum.textContent = index + 1;
                imgElement.classList.add('fade-enter-active');
            }, 150);
        }

        function startSlideshowAndRedirect() {
            clearInterval(progressTimer);
            const startTime = Date.now();
            const totalMs = totalDuration * 1000;

            progressTimer = setInterval(() => {
                const elapsedMs = Date.now() - startTime;
                const remainingMs = Math.max(0, totalMs - elapsedMs);
                countdownText.textContent = `${Math.ceil(remainingMs / 1000)}s`;
                progressBar.style.width = `${Math.min(100, (elapsedMs / totalMs) * 100)}%`;

                const calculatedIndex = Math.min(totalSlides - 1, Math.floor(elapsedMs / (config.slideDuration * 1000)));
                if (calculatedIndex !== currentSlideIndex) {
                    currentSlideIndex = calculatedIndex;
                    changeSlide(currentSlideIndex);
                }

                if (remainingMs <= 0) {
                    clearInterval(progressTimer);
                    window.location.href = config.targetUrl;
                }
            }, 100);
        }

        function openAdminModal() {
            inputTargetUrl.value = config.targetUrl || '';
            inputImages.value = (config.images || []).join('\n');
            inputPreviewImages.value = (config.previewImages || []).join('\n');
            inputSlideDuration.value = config.slideDuration || 3;
            inputPageTitle.value = config.pageTitle || '';
            adminModal.classList.remove('hidden');
        }

        closeAdminBtn.addEventListener('click', () => adminModal.classList.add('hidden'));
        document.addEventListener('keydown', e => {
            if (e.shiftKey && e.key.toLowerCase() === 'a') openAdminModal();
        });
        window.addEventListener('hashchange', () => {
            if (location.hash === '#admin') openAdminModal();
        });
        if (location.hash === '#admin') openAdminModal();

        configForm.addEventListener('submit', e => {
            e.preventDefault();
            const rawImages = inputImages.value.split('\n').map(u => u.trim()).filter(u => u);
            if (!rawImages.length) {
                alert("Sila masukkan sekurang-kurangnya satu pautan gambar slideshow!");
                return;
            }
            const rawPreview = inputPreviewImages.value.split('\n').map(u => u.trim()).filter(u => u);

            config = {
                targetUrl: inputTargetUrl.value.trim(),
                pageTitle: inputPageTitle.value.trim(),
                slideDuration: parseInt(inputSlideDuration.value, 10) || 3,
                images: rawImages,
                previewImages: rawPreview
            };
            localStorage.setItem('site_config', JSON.stringify(config));
            adminModal.classList.add('hidden');
            initPublicPage();
            alert("Tetapan berjaya disimpan!");
        });

        resetDefaultBtn.addEventListener('click', () => {
            if (confirm("Adakah anda pasti mahu mereset semua tetapan?")) {
                localStorage.removeItem('site_config');
                config = { ...DEFAULT_CONFIG };
                openAdminModal();
                initPublicPage();
            }
        });

        initPublicPage();
    </script>
</body>
</html>
