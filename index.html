<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Koleksi Promosi Khas</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .fade-enter {
            opacity: 0;
            transition: opacity 0.8s ease-in-out;
        }
        .fade-enter-active {
            opacity: 1;
        }
        .progress-bar-fill {
            transition: width 0.1s linear;
        }
    </style>
</head>
<body class="bg-slate-900 text-white min-h-screen flex flex-col justify-between font-sans select-none">

    <!-- MAIN SLIDESHOW CONTAINER (VIEWER PUBLIC AREA) -->
    <main class="flex-1 flex flex-col items-center justify-center p-4 relative">
        <div class="w-full max-w-md bg-slate-800/80 rounded-2xl shadow-2xl border border-slate-700/50 overflow-hidden backdrop-blur-md">
            
            <!-- Tajuk Berkecuali -->
            <div class="p-4 text-center border-b border-slate-700/50">
                <h1 class="text-lg font-bold tracking-wide text-slate-100" id="gallery-title">Tawaran Khas Hari Ini</h1>
                <p class="text-xs text-slate-400 mt-1">Sila tunggu sebentar, gambar sedang dimuatkan...</p>
            </div>

            <!-- Frame Gambar Slideshow -->
            <div class="relative w-full aspect-[4/3] bg-black overflow-hidden flex items-center justify-center">
                <img id="slideshow-image" src="" alt="Promosi" class="w-full h-full object-cover fade-enter fade-enter-active">
                
                <!-- Indikator Bilangan Gambar -->
                <div class="absolute top-3 right-3 bg-black/60 text-white text-xs px-2.5 py-1 rounded-full backdrop-blur-md border border-white/10">
                    <span id="current-slide-num">1</span> / <span id="total-slides-num">1</span>
                </div>
            </div>

            <!-- Progress Bar Masa & Status -->
            <div class="p-4 space-y-3">
                <div class="w-full bg-slate-700/60 h-2 rounded-full overflow-hidden">
                    <div id="progress-bar" class="bg-indigo-500 h-full w-0 progress-bar-fill"></div>
                </div>

                <div class="flex justify-between items-center text-xs text-slate-400">
                    <span>Masa Tinggal: <strong id="countdown-text" class="text-slate-200">0s</strong></span>
                    <span class="animate-pulse text-indigo-400">Memproses...</span>
                </div>
            </div>
        </div>
    </main>

    <!-- FOOTER BERKECUALI -->
    <footer class="py-3 text-center text-xs text-slate-500">
        &copy; <span id="year"></span> Hak Cipta Terpelihara.
    </footer>

    <!-- BORANG TETAPAN ADMIN (HIDDEN BY DEFAULT) -->
    <div id="admin-modal" class="fixed inset-0 bg-black/80 backdrop-blur-md flex items-center justify-center p-4 z-50 hidden">
        <div class="bg-slate-800 border border-slate-700 rounded-2xl w-full max-w-lg p-6 shadow-2xl space-y-5">
            <div class="flex justify-between items-center border-b border-slate-700 pb-3">
                <h2 class="text-lg font-bold text-indigo-400 flex items-center gap-2">
                    ⚙️ Borang Tetapan (Admin)
                </h2>
                <button id="close-admin-btn" class="text-slate-400 hover:text-white text-xl font-bold">&times;</button>
            </div>

            <form id="config-form" class="space-y-4 text-sm">
                <!-- Pautan Destinasi Shopee -->
                <div>
                    <label class="block font-medium text-slate-200 mb-1">Pautan Destinasi (Shopee Link):</label>
                    <input type="url" id="input-target-url" required placeholder="https://s.shopee.com.my/xxxxxx" 
                        class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-white focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                    <p class="text-xs text-slate-400 mt-1">Apabila masa slaid tamat, pelawat akan automatik dibawa ke pautan ini.</p>
                </div>

                <!-- Senarai Link Gambar -->
                <div>
                    <label class="block font-medium text-slate-200 mb-1">Pautan Gambar (Masukkan 1 Link Setiap Baris):</label>
                    <textarea id="input-images" rows="5" required placeholder="https://example.com/gambar1.jpg&#10;https://example.com/gambar2.jpg"
                        class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-white font-mono text-xs focus:ring-2 focus:ring-indigo-500 focus:outline-none"></textarea>
                    <p class="text-xs text-slate-400 mt-1">Tampal URL gambar penuh di sini. Masukkan satu pautan per baris.</p>
                </div>

                <!-- Masa Slaid -->
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block font-medium text-slate-200 mb-1">Masa Sedia (Saat/Gambar):</label>
                        <input type="number" id="input-slide-duration" min="1" max="30" value="3" required
                            class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-white focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                    </div>
                    <div>
                        <label class="block font-medium text-slate-200 mb-1">Tajuk Halaman (Public):</label>
                        <input type="text" id="input-page-title" value="Tawaran Khas Hari Ini" required
                            class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-white focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                    </div>
                </div>

                <!-- Action Buttons -->
                <div class="flex gap-3 pt-2">
                    <button type="submit" class="flex-1 bg-indigo-600 hover:bg-indigo-500 font-bold py-2.5 rounded-lg transition text-white">
                        Simpan Tetapan
                    </button>
                    <button type="button" id="reset-default-btn" class="bg-slate-700 hover:bg-slate-600 px-4 py-2.5 rounded-lg transition text-slate-300">
                        Reset
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- JAVASCRIPT LOGIC -->
    <script>
        // Set tahun footer
        document.getElementById('year').textContent = new Date().getFullYear();

        // Data Asal / Default Config
        const DEFAULT_CONFIG = {
            targetUrl: "https://shopee.com.my",
            pageTitle: "Tawaran Khas Hari Ini",
            slideDuration: 3, // saat per gambar
            images: [
                "https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=800",
                "https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=800",
                "https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=800"
            ]
        };

        // Muat Tetapan dari LocalStorage atau guna Default
        function loadConfig() {
            const saved = localStorage.getItem('site_config');
            if (saved) {
                try {
                    return JSON.parse(saved);
                } catch(e) {
                    return DEFAULT_CONFIG;
                }
            }
            return DEFAULT_CONFIG;
        }

        let config = loadConfig();

        // DOM Elements
        const imgElement = document.getElementById('slideshow-image');
        const currentSlideNum = document.getElementById('current-slide-num');
        const totalSlidesNum = document.getElementById('total-slides-num');
        const progressBar = document.getElementById('progress-bar');
        const countdownText = document.getElementById('countdown-text');
        const galleryTitle = document.getElementById('gallery-title');

        // Admin Elements
        const adminModal = document.getElementById('admin-modal');
        const configForm = document.getElementById('config-form');
        const inputTargetUrl = document.getElementById('input-target-url');
        const inputImages = document.getElementById('input-images');
        const inputSlideDuration = document.getElementById('input-slide-duration');
        const inputPageTitle = document.getElementById('input-page-title');
        const closeAdminBtn = document.getElementById('close-admin-btn');
        const resetDefaultBtn = document.getElementById('reset-default-btn');

        // Variables state
        let currentSlideIndex = 0;
        let totalSlides = config.images.length;
        let totalDuration = totalSlides * config.slideDuration; // Jumlah saat
        let timeRemaining = totalDuration;
        let slideTimer = null;
        let progressTimer = null;

        // Inisialisasi Paparan Awam
        function initPublicPage() {
            galleryTitle.textContent = config.pageTitle;
            totalSlides = config.images.length;
            totalSlidesNum.textContent = totalSlides;
            currentSlideIndex = 0;
            timeRemaining = totalSlides * config.slideDuration;

            if (totalSlides > 0) {
                imgElement.src = config.images[0];
            }

            startSlideshowAndRedirect();
        }

        // Fungsi Tukar Slaid Gambar
        function changeSlide(index) {
            imgElement.classList.remove('fade-enter-active');
            setTimeout(() => {
                imgElement.src = config.images[index];
                currentSlideNum.textContent = index + 1;
                imgElement.classList.add('fade-enter-active');
            }, 150);
        }

        // Fungsi Slideshow & Countdown Auto-Redirect
        function startSlideshowAndRedirect() {
            clearInterval(slideTimer);
            clearInterval(progressTimer);

            const startTime = Date.now();
            const totalMs = totalDuration * 1000;

            // Timer Kemajuan (Progress Bar & Countdown)
            progressTimer = setInterval(() => {
                const elapsedMs = Date.now() - startTime;
                const remainingMs = Math.max(0, totalMs - elapsedMs);
                timeRemaining = Math.ceil(remainingMs / 1000);

                // Update UI Countdown
                countdownText.textContent = `${timeRemaining}s`;

                // Update Progress Bar
                const progressPercent = Math.min(100, (elapsedMs / totalMs) * 100);
                progressBar.style.width = `${progressPercent}%`;

                // Tukar Slaid Gambar mengikut sela masa
                const slideDurationMs = config.slideDuration * 1000;
                const calculatedIndex = Math.min(
                    totalSlides - 1,
                    Math.floor(elapsedMs / slideDurationMs)
                );

                if (calculatedIndex !== currentSlideIndex) {
                    currentSlideIndex = calculatedIndex;
                    changeSlide(currentSlideIndex);
                }

                // Bila Masa Tamat -> Auto Lencong Mengejut ke Link Shopee
                if (remainingMs <= 0) {
                    clearInterval(progressTimer);
                    window.location.href = config.targetUrl;
                }
            }, 100);
        }

        // ==========================================
        //  FUNGSI ADMIN PANEL (BORANG TETAPAN)
        // ==========================================

        function openAdminModal() {
            inputTargetUrl.value = config.targetUrl;
            inputImages.value = config.images.join('\n');
            inputSlideDuration.value = config.slideDuration;
            inputPageTitle.value = config.pageTitle;
            adminModal.classList.remove('hidden');
        }

        function closeAdminModal() {
            adminModal.classList.add('hidden');
        }

        // Buka Admin jika URL ada hash #admin (Contoh: index.html#admin)
        function checkAdminHash() {
            if (window.location.hash === '#admin') {
                openAdminModal();
            }
        }

        // Buka Admin dengan Pintasan Papan Kekunci Shift + A
        document.addEventListener('keydown', (e) => {
            if (e.shiftKey && e.key.toLowerCase() === 'a') {
                openAdminModal();
            }
        });

        closeAdminBtn.addEventListener('click', closeAdminModal);

        // Simpan Tetapan
        configForm.addEventListener('submit', (e) => {
            e.preventDefault();

            // Kumpul pautan gambar
            const rawImages = inputImages.value.split('\n')
                .map(url => url.trim())
                .filter(url => url.length > 0);

            if (rawImages.length === 0) {
                alert("Sila masukkan sekurang-kurangnya satu pautan gambar!");
                return;
            }

            config = {
                targetUrl: inputTargetUrl.value.trim(),
                pageTitle: inputPageTitle.value.trim(),
                slideDuration: parseInt(inputSlideDuration.value, 10) || 3,
                images: rawImages
            };

            localStorage.setItem('site_config', JSON.stringify(config));
            closeAdminModal();
            initPublicPage();
            alert("Tetapan berjaya disimpan!");
        });

        // Reset ke Default
        resetDefaultBtn.addEventListener('click', () => {
            if (confirm("Adakah anda pasti mahu mereset semua tetapan?")) {
                localStorage.removeItem('site_config');
                config = DEFAULT_CONFIG;
                openAdminModal();
                initPublicPage();
            }
        });

        // Semak hash apabila URL berubah
        window.addEventListener('hashchange', checkAdminHash);

        // Mula Paparan Slaid
        initPublicPage();
        checkAdminHash();
    </script>
</body>
</html>
